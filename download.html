<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spisak datoteka - Nemanja Ršumović</title>

    <link rel="shortcut icon" type="image/png" href="slike/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">

    <style>
        body.download-page { padding: 64px 24px; }
        .dl-wrap { max-width: 640px; margin: 0 auto; }
        .dl-wrap h1 {
            font-family: var(--font-display);
            font-size: 28px;
            margin: 0 0 8px;
        }
        .dl-wrap .eyebrow { margin-bottom: 18px; }
        .dl-wrap p.lead { color: var(--text-dim); margin: 0 0 32px; }
        .dl-list { display: flex; flex-direction: column; gap: 10px; }
        .dl-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: border-color .2s ease, transform .2s ease;
        }
        .dl-item:hover { border-color: var(--accent-2); transform: translateX(4px); }
        .dl-item i { color: var(--accent-2); font-size: 16px; }
        .dl-item span { font-size: 14.5px; }
        .dl-back { display: inline-flex; align-items: center; gap: 8px; margin-top: 36px; font-family: var(--font-mono); font-size: 13.5px; color: var(--text-dim); }
        .dl-back:hover { color: var(--accent-2); }
    </style>
</head>
<body class="download-page grid-paper">
    <div class="dl-wrap">
        <p class="eyebrow mono">$ ls downloads/</p>
        <h1>Spisak datoteka za preuzimanje</h1>
        <p class="lead">Materijali i dokumenta za preuzimanje.</p>

        <div class="dl-list">
            <a class="dl-item" href="downloads/Nemanja_Rsumovic_CV.pdf" download="Nemanja_Rsumovic_CV.pdf"><i class="fa-solid fa-file-pdf"></i><span>Nemanja_Rsumovic_CV</span></a>
        </div>

        <a href="index.html" class="dl-back"><i class="fa-solid fa-arrow-left"></i> Nazad na sajt</a>
    </div>
</body>
</html>
