<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank you - Nemanja Ršumović</title>

  <link rel="shortcut icon" type="image/png" href="slike/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">

  <style>
    body.thankyou-page {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .thankyou-card {
      max-width: 440px;
    }
    .thankyou-card i {
      font-size: 40px;
      color: var(--accent-2);
      margin-bottom: 20px;
    }
    .thankyou-card h1 {
      font-family: var(--font-display);
      font-size: 30px;
      margin: 0 0 12px;
    }
    .thankyou-card p {
      color: var(--text-dim);
      font-size: 16px;
      margin: 0 0 30px;
    }
  </style>
</head>
<body class="thankyou-page grid-paper">
  <div class="thankyou-card reveal in-view">
    <i class="fa-solid fa-circle-check"></i>
    <h1>Message sent</h1>
    <p>Thanks for reaching out - I'll reply as soon as I can.</p>
    <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
  </div>
</body>
</html>
